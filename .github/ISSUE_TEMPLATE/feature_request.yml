name: Feature request
description: Propose a focused workflow, schema, validator, or export improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research workflow problem
      description: What concrete task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how it could be checked.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Scientific-authority boundary
      options:
        - label: The proposal keeps generated pixels separate from authoritative scientific content.
          required: true
