<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Synthetic restoration workflow</title>
  <desc id="description">A fictional measurement enters an editable model and produces an estimate.</desc>
  <style>
    :root {
      --background: #FCFCFD;
      --ink: #1F2937;
      --muted: #64748B;
      --cool: #2563EB;
      --accent: #7C3AED;
      --surface: #F8FAFC;
      --surface2: #E0E7FF;
    }
  </style>
  <rect id="canvas" x="0" y="0" width="1200" height="675" fill="var(--background)"/>
  <text id="figure-label" x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="var(--ink)">Synthetic restoration</text>

  <g id="stage-input" data-role="stage">
    <ellipse id="measurement" data-stage="input" data-entity-type="measurement" cx="210" cy="330" rx="72" ry="72" fill="#DBEAFE" stroke="var(--cool)" stroke-width="4"/>
    <text id="measurement-label" x="210" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ink)">Measurement</text>
  </g>

  <g id="stage-process" data-role="stage">
    <rect id="model" data-stage="process" data-entity-type="model" x="480" y="250" width="240" height="160" rx="26" fill="var(--surface2)" stroke="var(--accent)" stroke-width="4"/>
    <text id="model-label" data-latex="f_\theta" data-equation-role="operator" data-display-mode="inline" data-equation-width="120" data-equation-height="48" x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="var(--ink)">Model</text>
  </g>

  <g id="stage-output" data-role="stage">
    <rect id="estimate" data-stage="output" data-entity-type="estimate" x="930" y="258" width="150" height="144" rx="18" fill="#F3E8FF" stroke="var(--accent)" stroke-width="4"/>
    <text id="estimate-label" x="1005" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--ink)">Estimate</text>
  </g>

  <polyline id="flow-input-model" data-role="connector" data-relation-type="feeds" data-source="measurement" data-target="model" points="282,330 380,330 380,330 480,330" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <polygon id="arrowhead-flow-input-model" points="480,322 494,330 480,338" fill="var(--ink)"/>
  <polyline id="flow-model-output" data-role="connector" data-relation-type="produces" data-source="model" data-target="estimate" points="720,330 825,330 825,330 930,330" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <polygon id="arrowhead-flow-model-output" points="930,322 944,330 930,338" fill="var(--ink)"/>

  <text id="equation-restoration" data-latex="\hat{x}=f_\theta(y)" data-equation-role="primary" data-display-mode="inline" data-equation-width="260" data-equation-height="44" x="600" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="var(--muted)">y → x̂</text>
</svg>
